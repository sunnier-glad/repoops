[project]
name = "repoops"
version = "0.1.0"
description = "GitHub project collaboration and release quality platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14",
  "celery>=5.4",
  "cryptography>=43",
  "fastapi>=0.115",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
